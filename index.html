<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Registro</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js"></script>
</head>
<body>

    <form id="registro" method="post" novalidate>
        <h1>REGÍSTRATE!</h1>

        <ul>
            <li>
                <label for="nombre">Mi nombre es:</label>
                <input type="text" id="nombre" required autofocus>
            </li>

            <li>
                <label for="email">Mi email es:</label>
                <p>(puedes introducir varios separados por comas)</p>
                <input type="email" id="email" required multiple>
            </li>

            <li class="checkbox-item">
                <label>Recuérdame en este equipo</label>
                <input type="checkbox">
            </li>

            <li>
                <label for="url">Mi dirección web es:</label>
                <input type="url" id="url" placeholder="http://ejemplo.com">
            </li>

            <li>
                <label for="password1">Me gustaría que mi password fuera:</label>
                <p>(al menos 6 caracteres, sin espacios)</p>
                <input type="password" id="password1" required pattern="\S{6,}">
            </li>

            <li>
                <label for="password2">Mi password repetida es:</label>
                <input type="password" id="password2" required pattern="\S{6,}">
            </li>

            <li>
                <label>En una escala de 1 a 10, mis conocimientos de HTML5 son:</label>
                <input type="range" id="conocimientos" min="1" max="10">
                <div class="linea-puntos"></div>
            </li>

            <li>
                <label for="fechaInicio">Por favor, inicia mi suscripción el día:</label>
                <input type="date" id="fechaInicio" required placeholder="dd/mm/aaaa">
            </li>

            <li class="inline-item">
                <label>Me gustaría recibir
                <input type="number" id="cantidad" value="1" min="0" max="5">
                 copias de <cite>El manual de HTML5</cite>.</label>
            </li>

            <li class="checkbox-item">
                <label>También regístrame para <em>El manual de CSS3</em></label>
                <input type="checkbox">
            </li>

            <li>
                <button type="button" id="enviar">ENVÍAME</button>
            </li>
        </ul>
    </form>

</body>
</html>
